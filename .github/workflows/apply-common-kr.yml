name: Aplicar Kr configurable común

on:
  push:
    branches:
      - agent/kr-configurable-comun

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/kr-configurable-comun

      - name: Parametrizar Kr en Lartigau
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path("app_emergencia_core.py")
          report_path = Path("app_emergencia.py")
          workflow_path = Path(".github/workflows/apply-common-kr.yml")
          source = core_path.read_text(encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: se esperaba 1 coincidencia y se encontraron {count}")
              return text.replace(old, new, 1)

          source = replace_once(
              source,
              '''WMAX_PREDETERMINADO = 18.816
          COBERTURA_PREDETERMINADA = 75
          ''',
              '''WMAX_PREDETERMINADO = 18.816
          COBERTURA_PREDETERMINADA = 75
          EXPONENTE_KR_PREDETERMINADO = 0.0
          ''',
              "constante Kr",
          )

          old_balance = '''def surface_water_balance(
              precipitation: np.ndarray,
              et0: np.ndarray,
              w_max: float,
              ke_soil: float,
          ) -> np.ndarray:
              precipitation = np.asarray(precipitation, dtype=float)
              et0 = np.asarray(et0, dtype=float)

              water = np.zeros(len(precipitation), dtype=float)
              if len(water) == 0:
                  return water

              water[0] = float(w_max) / 2.0
              for index in range(1, len(water)):
                  actual_evaporation = et0[index] * float(ke_soil)
                  water[index] = np.clip(
                      water[index - 1]
                      + precipitation[index]
                      - actual_evaporation,
                      0.0,
                      float(w_max),
                  )
              return water
          '''
          new_balance = '''def surface_water_balance(
              precipitation: np.ndarray,
              et0: np.ndarray,
              w_max: float,
              ke_soil: float,
              kr_exponent: float = EXPONENTE_KR_PREDETERMINADO,
              return_kr: bool = False,
          ) -> np.ndarray | tuple[np.ndarray, np.ndarray]:
              """Balance común con Kr configurable.

              kr_exponent=0 conserva exactamente ET0 × Ke constante.
              kr_exponent=1 reproduce la adaptación de Tres Arroyos.
              """
              precipitation = np.asarray(precipitation, dtype=float)
              et0 = np.asarray(et0, dtype=float)

              water = np.zeros(len(precipitation), dtype=float)
              kr_daily = np.ones(len(precipitation), dtype=float)
              if len(water) == 0:
                  return (water, kr_daily) if return_kr else water
              if float(w_max) <= 0.0:
                  raise ValueError("Wmax debe ser mayor que cero.")

              exponent = max(float(kr_exponent), 0.0)
              water[0] = float(w_max) / 2.0
              for index in range(1, len(water)):
                  relative_previous_water = float(
                      np.clip(water[index - 1] / float(w_max), 0.0, 1.0)
                  )
                  kr = (
                      1.0
                      if exponent == 0.0
                      else relative_previous_water ** exponent
                  )
                  kr_daily[index] = kr
                  actual_evaporation = et0[index] * float(ke_soil) * kr
                  water[index] = np.clip(
                      water[index - 1]
                      + precipitation[index]
                      - actual_evaporation,
                      0.0,
                      float(w_max),
                  )
              return (water, kr_daily) if return_kr else water
          '''
          source = replace_once(source, old_balance, new_balance, "balance común")

          source = replace_once(
              source,
              '''    thermoinhibition_threshold: float = UMBRAL_TERMINHIBICION,
              hydric_shock_threshold: float = UMBRAL_CHOQUE_HIDRICO_MM,
          ) -> tuple[pd.DataFrame, int | None]:
          ''',
              '''    thermoinhibition_threshold: float = UMBRAL_TERMINHIBICION,
              hydric_shock_threshold: float = UMBRAL_CHOQUE_HIDRICO_MM,
              kr_exponent: float = EXPONENTE_KR_PREDETERMINADO,
          ) -> tuple[pd.DataFrame, int | None]:
          ''',
              "firma simulación",
          )

          source = replace_once(
              source,
              '''    data["Ke_Suelo"] = ke_value
              data["Modulador_Termico_Diagnostico"] = thermal_modulator
          ''',
              '''    data["Ke_Suelo"] = ke_value
              data["Exponente_Kr"] = float(kr_exponent)
              data["Modulador_Termico_Diagnostico"] = thermal_modulator
          ''',
              "diagnóstico Kr",
          )

          source = replace_once(
              source,
              '''    data["W_superficial"] = surface_water_balance(
                  data["Prec"].to_numpy(),
                  data["ET0"].to_numpy(),
                  float(w_max),
                  ke_value,
              )
              relative_water = data["W_superficial"] / max(float(w_max), 1e-12)
          ''',
              '''    water, kr_daily = surface_water_balance(
                  data["Prec"].to_numpy(),
                  data["ET0"].to_numpy(),
                  float(w_max),
                  ke_value,
                  kr_exponent=float(kr_exponent),
                  return_kr=True,
              )
              data["W_superficial"] = water
              data["Kr_Diario"] = kr_daily
              relative_water = data["W_superficial"] / max(float(w_max), 1e-12)
          ''',
              "uso Kr en simulación",
          )

          source = replace_once(
              source,
              '''    thermoinhibition_threshold: float,
              hydric_shock_threshold: float,
          ) -> pd.DataFrame:
          ''',
              '''    thermoinhibition_threshold: float,
              hydric_shock_threshold: float,
              kr_exponent: float,
          ) -> pd.DataFrame:
          ''',
              "firma optimizador",
          )

          source = replace_once(
              source,
              '''                hydric_shock_threshold=float(hydric_shock_threshold),
                      )
          ''',
              '''                hydric_shock_threshold=float(hydric_shock_threshold),
                          kr_exponent=float(kr_exponent),
                      )
          ''',
              "Kr en optimizador",
          )

          source = replace_once(
              source,
              '''                    "W_Max_mm": float(wmax),
                          "Fecha_Primer_Pico": first_date,
          ''',
              '''                    "W_Max_mm": float(wmax),
                          "Exponente_Kr": float(kr_exponent),
                          "Fecha_Primer_Pico": first_date,
          ''',
              "salida optimizador",
          )

          old_wmax_ui = '''w_max_value = st.sidebar.number_input(
              "Capacidad superficial Wmax (mm)",
              min_value=5.0,
              max_value=60.0,
              value=WMAX_PREDETERMINADO,
              step=0.1,
              format="%.3f",
          )
          thermoinhibition_threshold = st.sidebar.number_input(
          '''
          new_wmax_ui = '''w_max_value = st.sidebar.number_input(
              "Capacidad superficial Wmax (mm)",
              min_value=5.0,
              max_value=60.0,
              value=WMAX_PREDETERMINADO,
              step=0.1,
              format="%.3f",
          )
          kr_exponent = st.sidebar.slider(
              "Exponente Kr (secado superficial)",
              min_value=0.0,
              max_value=2.0,
              value=EXPONENTE_KR_PREDETERMINADO,
              step=0.1,
              help=(
                  "0 conserva el balance histórico de Lartigau (ET0×Ke). "
                  "1 aplica la adaptación Kr de Tres Arroyos."
              ),
          )
          st.sidebar.caption(
              f"Kr diario = (W/Wmax)^{kr_exponent:.1f}."
          )
          thermoinhibition_threshold = st.sidebar.number_input(
          '''
          source = replace_once(source, old_wmax_ui, new_wmax_ui, "interfaz Kr")

          source = replace_once(
              source,
              '''        hydric_shock_threshold=float(hydric_shock_threshold),
              )
          except Exception as exc:
          ''',
              '''        hydric_shock_threshold=float(hydric_shock_threshold),
                  kr_exponent=float(kr_exponent),
              )
          except Exception as exc:
          ''',
              "Kr en motor principal",
          )

          source = replace_once(
              source,
              '''                float(thermoinhibition_threshold),
                          float(hydric_shock_threshold),
                      )
          ''',
              '''                float(thermoinhibition_threshold),
                          float(hydric_shock_threshold),
                          float(kr_exponent),
                      )
          ''',
              "Kr en llamada del optimizador",
          )

          compile(source, str(core_path), "exec")
          if source.count("kr_exponent") < 10:
              raise RuntimeError("Kr no quedó integrado en todos los componentes.")
          if "EXPONENTE_KR_PREDETERMINADO = 0.0" not in source:
              raise RuntimeError("Lartigau debe conservar Kr=0 como predeterminado.")
          core_path.write_text(source, encoding="utf-8")

          report = report_path.read_text(encoding="utf-8")
          report = replace_once(
              report,
              '''                "Ke aplicado",
                      ],
          ''',
              '''                "Ke aplicado",
                          "Exponente Kr configurable",
                      ],
          ''',
              "resumen reporte Kr etiqueta",
          )
          report = replace_once(
              report,
              '''                globals().get("ke_value", ""),
                      ],
          ''',
              '''                globals().get("ke_value", ""),
                          globals().get("kr_exponent", ""),
                      ],
          ''',
              "resumen reporte Kr valor",
          )
          report = replace_once(
              report,
              '''                "Umbral de alerta temprana",
                      ],
          ''',
              '''                "Umbral de alerta temprana",
                          "Exponente Kr",
                      ],
          ''',
              "parámetros reporte Kr etiqueta",
          )
          report = replace_once(
              report,
              '''                globals().get("alert_threshold", ""),
                      ],
          ''',
              '''                globals().get("alert_threshold", ""),
                          globals().get("kr_exponent", ""),
                      ],
          ''',
              "parámetros reporte Kr valor",
          )
          compile(report, str(report_path), "exec")
          report_path.write_text(report, encoding="utf-8")

          workflow_path.unlink()
          PY

      - name: Validar sintaxis y diff
        shell: bash
        run: |
          python -m py_compile app_emergencia_core.py app_emergencia.py
          git diff --check

      - name: Publicar parametrización
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git commit -m "Agregar Kr configurable común"
          git push origin HEAD:agent/kr-configurable-comun
