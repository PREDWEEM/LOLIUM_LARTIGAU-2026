name: Diagnosticar migración Kr

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/kr-configurable-comun'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Ejecutar y capturar resultado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          import traceback

          original = Path('.github/workflows/apply-common-kr.yml')
          try:
              workflow = original.read_text(encoding='utf-8')
              marker_start = "          python - <<'PY'\n"
              marker_end = "\n          PY\n"
              start = workflow.index(marker_start) + len(marker_start)
              end = workflow.index(marker_end, start)
              script = textwrap.dedent(workflow[start:end])
              exec(compile(script, 'apply-common-kr-inline.py', 'exec'), {})
              Path('migration_error.txt').unlink(missing_ok=True)
          except Exception:
              Path('migration_error.txt').write_text(traceback.format_exc(), encoding='utf-8')
          finally:
              for path in Path('.github/workflows').glob('apply-common-kr*.yml'):
                  path.unlink(missing_ok=True)
          PY

      - name: Publicar diagnóstico o cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Registrar resultado de migración Kr"
          git push origin HEAD:agent/kr-configurable-comun
