name: Preparar núcleo para repositorio privado

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/prepare_private_repo.yml

permissions:
  contents: write

jobs:
  prepare-private-core:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar rama del cambio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Aplicar ajustes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("app_emergencia_core.py")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"@st\.cache_resource\ndef load_models\(\) -> tuple\[PracticalANNModel \| None, Any \| None\]:.*?\n\n\ndef read_table",
              re.DOTALL,
          )
          replacement = '''REQUIRED_MODEL_FILES = {
              "IW.npy": BASE / "IW.npy",
              "bias_IW.npy": BASE / "bias_IW.npy",
              "LW.npy": BASE / "LW.npy",
              "bias_out.npy": BASE / "bias_out.npy",
              "modelo_clusters_k3.pkl": BASE / "modelo_clusters_k3.pkl",
          }


          def validate_required_model_files() -> dict[str, Path]:
              """Detiene la aplicación si falta un activo científico requerido."""
              missing = [
                  name
                  for name, model_path in REQUIRED_MODEL_FILES.items()
                  if not model_path.is_file()
              ]
              if missing:
                  st.error(
                      "Faltan activos requeridos del modelo PREDWEEM: "
                      + ", ".join(missing)
                      + ". Verifique el checkout privado y el despliegue de Streamlit."
                  )
                  st.stop()
              return REQUIRED_MODEL_FILES


          @st.cache_resource
          def load_models() -> tuple[PracticalANNModel, Any]:
              required = validate_required_model_files()
              try:
                  ann = PracticalANNModel(
                      np.load(required["IW.npy"]),
                      np.load(required["bias_IW.npy"]),
                      np.load(required["LW.npy"]),
                      np.load(required["bias_out.npy"]),
                  )
                  with required["modelo_clusters_k3.pkl"].open("rb") as handle:
                      cluster_model = pickle.load(handle)
              except Exception as exc:
                  st.error(f"No se pudieron cargar los activos del modelo: {exc}")
                  st.stop()
              return ann, cluster_model


          def read_table'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError("No se pudo reforzar la carga de modelos.")

          sidebar_marker = 'st.sidebar.markdown("## ⚙️ Fisiología y logística")'
          sidebar_replacement = '''logo_path = BASE / "logo.png"
          if logo_path.is_file():
              st.sidebar.image(str(logo_path), width="stretch")
          else:
              st.sidebar.markdown("## 🌾 PREDWEEM")
              st.sidebar.caption("Motor predictivo Lolium — Lartigau")

          st.sidebar.markdown("## ⚙️ Fisiología y logística")'''
          if sidebar_marker not in text:
              raise RuntimeError("No se encontró el inicio del sidebar.")
          text = text.replace(sidebar_marker, sidebar_replacement, 1)

          if re.search(
              r"raw\.githubusercontent\.com/PREDWEEM/(LOLIUM_LARTIGAU-2026|LOLIUM_LARTIGAU_2026)",
              text,
          ):
              raise RuntimeError("Persisten referencias públicas al propio repositorio.")

          path.write_text(text, encoding="utf-8")

          Path(".gitignore").write_text(
              """# Configuración local\n.env\n.env.*\n!.env.example\n.streamlit/secrets.toml\nsecrets.toml\n\n# Python\n__pycache__/\n*.py[cod]\n.venv/\nvenv/\n.pytest_cache/\n\n# Editores y sistema\n.vscode/\n.idea/\n.DS_Store\nThumbs.db\n\n# Directorios locales\ndata/private/\nprivate/\nexports/\noutput/\n*.tmp\n*.bak\n""",
              encoding="utf-8",
          )
          PY

      - name: Verificar sintaxis
        run: |
          python -m py_compile app_emergencia.py app_emergencia_core.py
          git diff --check

      - name: Guardar ajuste
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_emergencia_core.py .gitignore
          if git diff --cached --quiet; then
            echo "No hay cambios adicionales para guardar."
            exit 0
          fi
          git commit -m "Adaptar recursos para repositorio privado"
          git push origin HEAD:${{ github.head_ref }}
