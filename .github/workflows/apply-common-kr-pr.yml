name: Aplicar Kr común desde PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'agent/kr-configurable-comun'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la rama
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Ejecutar migración preparada
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-common-kr.yml').read_text(encoding='utf-8')
          marker_start = "          python - <<'PY'\n"
          marker_end = "\n          PY\n"
          start = workflow.index(marker_start) + len(marker_start)
          end = workflow.index(marker_end, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'apply-common-kr-inline.py', 'exec'), {})
          Path('.github/workflows/apply-common-kr-pr.yml').unlink(missing_ok=True)
          PY

      - name: Validar y publicar
        shell: bash
        run: |
          python -m py_compile app_emergencia_core.py app_emergencia.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Agregar Kr configurable común"
          git push origin HEAD:agent/kr-configurable-comun
