name: Aplicar bloqueo inicial de 25 dias
on:
  push:
    branches: [agent/bloqueo-emergencia-25-dias]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bloqueo-emergencia-25-dias
          fetch-depth: 0
      - name: Ajustar latencia y validar Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast, re, py_compile
          ROOT=Path('.'); changed=[]; notes=[]
          def starts(text):
              out=[0]
              for m in re.finditer(r'\n',text): out.append(m.end())
              return out
          def span(node,offs): return (offs[node.lineno-1]+node.col_offset,offs[node.end_lineno-1]+node.end_col_offset)
          def isnum(node,value): return isinstance(node,ast.Constant) and not isinstance(node.value,bool) and node.value==value
          def names(node):
              if isinstance(node,ast.Name): return [node.id]
              if isinstance(node,ast.Attribute): return [node.attr]
              if isinstance(node,(ast.Tuple,ast.List)):
                  return [n for elt in node.elts for n in names(elt)]
              return []
          def latname(name): return 'LATENCIA' in name.upper() or 'BLOQUEO' in name.upper()
          def collect(text,tree):
              offs=starts(text); reps={}
              def add(node,value,reason):
                  if getattr(node,'end_lineno',None) is not None: reps[span(node,offs)]=(str(value),reason)
              for node in ast.walk(tree):
                  if isinstance(node,ast.Assign):
                      ns=[n for target in node.targets for n in names(target)]
                      if any(latname(n) for n in ns) and isnum(node.value,45): add(node.value,25,'constante de latencia')
                  elif isinstance(node,ast.AnnAssign):
                      if any(latname(n) for n in names(node.target)) and isnum(node.value,45): add(node.value,25,'constante anotada')
                  elif isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.Lambda)):
                      pos=list(node.args.posonlyargs)+list(node.args.args); defs=[None]*(len(pos)-len(node.args.defaults))+list(node.args.defaults)
                      for arg,default in zip(pos,defs):
                          if default is not None and latname(arg.arg) and isnum(default,45): add(default,25,'default de latencia')
                      for arg,default in zip(node.args.kwonlyargs,node.args.kw_defaults):
                          if default is not None and latname(arg.arg) and isnum(default,45): add(default,25,'default keyword')
                  elif isinstance(node,ast.Call):
                      for kw in node.keywords:
                          if kw.arg and latname(kw.arg) and isnum(kw.value,45): add(kw.value,25,'argumento de latencia')
                  elif isinstance(node,ast.Compare):
                      seg=ast.get_source_segment(text,node) or ''
                      if re.search(r'Julian_days|dayofyear|\bJD\b|latencia|bloqueo',seg,re.I):
                          for op in [node.left]+list(node.comparators):
                              if isnum(op,45): add(op,25,'limite juliano')
                              elif isnum(op,46): add(op,26,'inicio post-latencia')
                  elif isinstance(node,ast.Dict):
                      pairs=list(zip(node.keys,node.values))
                      for key,value in pairs:
                          if isinstance(key,ast.Constant) and isinstance(key.value,str) and re.search(r'latencia|bloqueo',key.value,re.I) and isnum(value,45): add(value,25,'parametro en diccionario')
                      labels=values=None
                      for key,value in pairs:
                          if isinstance(key,ast.Constant) and isinstance(key.value,str) and isinstance(value,(ast.List,ast.Tuple)):
                              if any(isinstance(e,ast.Constant) and isinstance(e.value,str) and re.search(r'latencia fija|bloqueo inicial',e.value,re.I) for e in value.elts): labels=value
                              if key.value.lower() in {'valor','valores','value','values'}: values=value
                      if labels is not None and values is not None:
                          for i,e in enumerate(labels.elts):
                              if isinstance(e,ast.Constant) and isinstance(e.value,str) and re.search(r'latencia fija|bloqueo inicial',e.value,re.I) and i<len(values.elts) and isnum(values.elts[i],45): add(values.elts[i],25,'latencia del reporte')
              return reps
          def patchlines(text):
              out=[]; count=0
              for line in text.splitlines(keepends=True):
                  old=line
                  if re.search(r'latencia|bloqueo',line,re.I):
                      line=re.sub(r'((?:latencia|bloqueo)[^\n]{0,90}?)\b45\b',lambda m:m.group(1)+'25',line,flags=re.I)
                      line=re.sub(r'\bprimeros\s+45\s+d[ií]as\b','primeros 25 días',line,flags=re.I)
                  if re.search(r'choque|ruptura|inicio|latencia',line,re.I): line=re.sub(r'\bJD\s*46\b','JD 26',line,flags=re.I)
                  count+=line!=old; out.append(line)
              return ''.join(out),count
          for path in sorted(ROOT.rglob('*.py')):
              if any(p.startswith('.') for p in path.parts) or '__pycache__' in path.parts: continue
              text=path.read_text(encoding='utf-8')
              try: tree=ast.parse(text,filename=str(path))
              except SyntaxError: continue
              reps=collect(text,tree); new=text
              for (a,b),(value,reason) in sorted(reps.items(),reverse=True): new=new[:a]+value+new[b:]; notes.append(f'{path}: {reason}')
              new,ntext=patchlines(new)
              if ntext: notes.append(f'{path}: {ntext} texto(s)')
              if new!=text:
                  path.write_text(new,encoding='utf-8'); py_compile.compile(str(path),doraise=True); changed.append(str(path))
          problems=[]
          for path in sorted(ROOT.rglob('*.py')):
              if any(p.startswith('.') for p in path.parts) or '__pycache__' in path.parts: continue
              text=path.read_text(encoding='utf-8')
              try: tree=ast.parse(text,filename=str(path))
              except SyntaxError: continue
              if collect(text,tree): problems.append(f'{path}: quedan referencias funcionales a 45/46 dias')
              for i,line in enumerate(text.splitlines(),1):
                  if re.search(r'((?:latencia|bloqueo)[^\n]{0,90}?)\b45\b',line,re.I): problems.append(f'{path}:{i}: texto de latencia en 45')
                  if re.search(r'\bJD\s*46\b',line,re.I) and re.search(r'choque|ruptura|inicio|latencia',line,re.I): problems.append(f'{path}:{i}: inicio post-latencia en JD46')
          if problems: raise SystemExit('\n'.join(problems))
          print('Archivos modificados:',changed or 'ninguno; ya estaba en 25 dias'); print('\n'.join(notes))
          PY
          rm .github/workflows/aplicar-bloqueo-25.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta bloqueo inicial de emergencia a 25 dias"
          git push origin agent/bloqueo-emergencia-25-dias
