name: Capturar error Kr común

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  debug:
    if: github.head_ref == 'agent/kr-configurable-comun'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Ejecutar con diagnóstico
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          import traceback

          try:
              runpy.run_path('tools/apply_common_kr.py', run_name='__main__')
              Path('migration_error.txt').unlink(missing_ok=True)
          except Exception:
              Path('migration_error.txt').write_text(traceback.format_exc(), encoding='utf-8')
          finally:
              Path('.github/workflows/debug-common-kr-fix.yml').unlink(missing_ok=True)
              Path('.github/workflows/run-common-kr-fix.yml').unlink(missing_ok=True)
          PY

      - name: Publicar diagnóstico
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Registrar diagnóstico de Kr común"
          git push origin HEAD:agent/kr-configurable-comun
